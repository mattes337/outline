version: '3'

services:
  outline:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
      - "3001:3001"
      - "9229:9229"
    depends_on:
      - postgres
      - redis
    volumes:
      # Use delegated mode for better performance with hot reload
      - .:/opt/outline:delegated
      - outline-node-modules:/opt/outline/node_modules
      - outline-data:/var/lib/outline/data
      # Exclude node_modules from the bind mount to improve performance
      - /opt/outline/node_modules
    # Add healthcheck to ensure the service is running properly
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - NODE_ENV=development
      - URL=http://localhost:3000
      - DATABASE_URL=postgres://user:pass@postgres:5432/outline
      - REDIS_URL=redis://redis:6379
      - FILE_STORAGE=local
      - FILE_STORAGE_LOCAL_ROOT_DIR=/var/lib/outline/data
      - DEBUG=vite:*,nodemon:*,http,express:*,socket.io:*
      - LOG_LEVEL=debug
      - DEVELOPMENT_UNSAFE_INLINE_CSP=true
      - SECRET_KEY=F0E5AD933D7F6FD8F4DBB3E038C501C052DC0593C686D21ACB30AE205D2F634B
      - UTILS_SECRET=F0E5AD933D7F6FD8F4DBB3E038C501C052DC0593C686D21ACB30AE205D2F634B
      # Hot reload configuration
      - VITE_ENABLE_HMR=true
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - CHOKIDAR_INTERVAL=1000
      - FAST_REFRESH=true
      - VITE_HMR_HOST=0.0.0.0
      - VITE_HMR_PORT=3001
      - VITE_HMR_PROTOCOL=ws
    stdin_open: true
    tty: true

  postgres:
    image: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: outline
    volumes:
      - outline-postgres:/var/lib/postgresql/data
    user: "postgres:postgres"

  redis:
    image: redis
    ports:
      - "6379:6379"
    volumes:
      - outline-redis:/data
    user: "redis:redis"

volumes:
  outline-postgres:
  outline-redis:
  outline-node-modules:
  outline-data:

