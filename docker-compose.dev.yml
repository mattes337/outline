version: '3'

services:
  outline:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
      - "3001:3001"
      - "9229:9229"
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/opt/outline:cached
      - outline-node-modules:/opt/outline/node_modules
      - outline-data:/var/lib/outline/data
      # Exclude node_modules from the bind mount to improve performance
      - /opt/outline/node_modules
    environment:
      - NODE_ENV=development
      - URL=http://localhost:3000
      - DATABASE_URL=postgres://user:pass@postgres:5432/outline
      - REDIS_URL=redis://redis:6379
      - FILE_STORAGE=local
      - FILE_STORAGE_LOCAL_ROOT_DIR=/var/lib/outline/data
      - DEBUG=http
      - LOG_LEVEL=debug
      - DEVELOPMENT_UNSAFE_INLINE_CSP=true
      - SECRET_KEY=F0E5AD933D7F6FD8F4DBB3E038C501C052DC0593C686D21ACB30AE205D2F634B
      - UTILS_SECRET=F0E5AD933D7F6FD8F4DBB3E038C501C052DC0593C686D21ACB30AE205D2F634B
    stdin_open: true
    tty: true

  postgres:
    image: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: outline
    volumes:
      - outline-postgres:/var/lib/postgresql/data
    user: "postgres:postgres"

  redis:
    image: redis
    ports:
      - "6379:6379"
    volumes:
      - outline-redis:/data
    user: "redis:redis"

volumes:
  outline-postgres:
  outline-redis:
  outline-node-modules:
  outline-data:
